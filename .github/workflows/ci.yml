name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run browser regression tests against local replay services
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No live model calls or current observation lookups in the default checks.
      AGENT_LLM_PROVIDER: gemini
      GEMINI_API_KEY: ""
      FLOODOPS_TWIN_MODE: replay
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        run: python -m pytest backend/tests -q --junitxml=reports/backend.xml
      - name: Offline Agent benchmark
        run: python backend/evaluation/agent_benchmark.py --mode offline --output reports/agent-benchmark-offline.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Install browser for optional E2E
        if: github.event_name == 'workflow_dispatch' && inputs.e2e
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests (local replay services)
        if: github.event_name == 'workflow_dispatch' && inputs.e2e
        run: npm run test:e2e
      - name: Preserve test and evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Validate the tracked Docker build inputs. No registry push or deployment.
      - name: Build AWS image from the tested commit
        run: docker build --file Dockerfile.aws --tag floodops:sha-${{ github.sha }} .
      - name: Smoke test the image without external network access
        run: |
          container=$(docker run --detach --network none --env GEMINI_API_KEY= --env FLOODOPS_TWIN_MODE=replay floodops:sha-${{ github.sha }})
          trap 'docker rm --force "$container"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" python -c 'import json, urllib.request; health=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health")); events=json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/events")); page=urllib.request.urlopen("http://127.0.0.1:8000/"); assert health["status"] == "ok" and events and page.status == 200'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
