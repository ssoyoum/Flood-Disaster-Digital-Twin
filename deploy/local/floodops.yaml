apiVersion: v1
kind: Namespace
metadata:
  name: floodops-learning
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: floodops
  namespace: floodops-learning
data:
  FLOODOPS_TWIN_MODE: replay
  AGENT_LLM_PROVIDER: gemini
---
apiVersion: v1
kind: Secret
metadata:
  name: floodops-offline
  namespace: floodops-learning
type: Opaque
stringData:
  # Deliberately empty: this local exercise must not enable paid model calls.
  GEMINI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floodops
  namespace: floodops-learning
spec:
  replicas: 1
  # Scenarios are in memory; this exercise does not claim replica consistency.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: floodops
  template:
    metadata:
      labels:
        app: floodops
    spec:
      automountServiceAccountToken: false
      containers:
        - name: floodops
          image: floodops:learning-v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: floodops
            - secretRef:
                name: floodops-offline
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: floodops
  namespace: floodops-learning
spec:
  selector:
    app: floodops
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
