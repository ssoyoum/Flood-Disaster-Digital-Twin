schema_version: "1.0"
inventory_date: "2026-08-31"
date_policy:
  data_year: "The year represented by the observation or event."
  source_updated_at: "The last modified date shown by the source portal."
  acquired_at: "The date this repository downloaded the file."
  snapshot_date: "The observation/query time for continuously updated sources."

simulation_temporal_policy:
  event_id: "osong-2023"
  event_date: "2023-07-15"
  primary_event_sources: [official_flood_extent, kma_aws_asos, official_damage, official_relief, emergency_alerts]
  spatial_base_sources: [osm, worldpop, copernicus_dem]
  runtime_api_calls: false
  notes:
    - "Approved API responses are stored as historical snapshots for simulation and annual refresh, not called on every application run."

temporal_alignment_policy:
  event_year: "The year of the disaster event being simulated."
  boundary_snapshot: "The source boundary vintage used for spatial aggregation; it must be recorded separately from event_year."
  boundary_selection: "Prefer an official Korean boundary snapshot from the event year or the nearest available year. Apply the same rule to future event scenarios."
  population_selection:
    priority_1: "Statistics Korea / SGIS official detailed spatial population"
    priority_2: "Official eup-myeon-dong population totals plus WorldPop spatial-distribution adjustment"
    priority_3: "WorldPop-only estimate as fallback"
  population_usage:
    administrative_unit_total: "Official statistics only"
    regional_comparison: "Official eup-myeon-dong population"
    flood_extent_exposure: "Official detailed grid population when available; otherwise official eup-myeon-dong total plus WorldPop distribution adjustment"
    worldpop_only: "Fallback only"

